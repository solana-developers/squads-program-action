name: Squad Upgrade Action
description:
  Action to perform a squad upgrade on Solana including IDL and Verify PDA
author: Solana Foundation

# Add your action's branding here. This will appear on the GitHub Marketplace.
branding:
  icon: heart
  color: blue

# Define your inputs here.
inputs:
  rpc:
    description: 'RPC URL for Solana'
    required: true
  program:
    description: 'Program ID to upgrade'
    required: true
  buffer:
    description: 'Buffer containing the new program'
    required: true
  idl-buffer:
    description: 'Buffer containing the new Anchor IDL'
    required: false
  metadata-buffer:
    description:
      'Buffer containing the new IDL for the program-metadata program
      (alternative to idl-buffer for non-Anchor programs)'
    required: false
  multisig:
    description: 'Squads multisig address'
    required: true
  keypair:
    description:
      'Byte array of the keypair. Needs to have at least voter permission in
      squads. Format: [23,42,53...]. Not required when export is true.'
    required: false
  pda-tx:
    description:
      'Base58 or base64 encoded PDA verification transaction. Get this from
      solana verify cli using solana-verify export-pda-tx'
    required: false
  priority-fee:
    description: 'Priority fee in lamports for the transaction'
    required: false
    default: '100000'
  vault-index:
    description: 'Index of the Squads vault to use'
    required: false
    default: '0'
  export:
    description:
      'Export the combined transaction instead of creating the Squads vault
      transaction. No keypair or Squads membership needed; import the output
      into the Squads transaction builder to create the proposal.'
    required: false
    default: 'false'
  export-encoding:
    description: 'Encoding for the exported transaction (base58, base64)'
    required: false
    default: 'base58'

outputs:
  time:
    description: Signature of the squads transaction
  tx:
    description: 'Exported combined transaction (only set if export is true)'

runs:
  using: node20
  main: dist/index.js
